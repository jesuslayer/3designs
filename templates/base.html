<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Trading Bots Pro | Landing Premium{% endblock %}</title>
    <meta name="description" content="Acceso premium a bots de trading en Python, soporte y actualizaciones continuas." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trading Bots Pro | Acceso Premium" />
    <meta property="og:description" content="Consigue bots de trading Python + soporte + updates desde una sola membresía." />
    <meta property="og:url" content="http://localhost:5000/" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top glass-nav">
      <div class="container">
        <a class="navbar-brand text-neon fw-bold" href="{{ url_for('index') }}">TradingBots Pro</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#features">Características</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#pricing">Precios</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#faq">FAQs</a></li>
            <li class="nav-item">
              <a class="btn btn-neon" href="{{ url_for('premium') }}">Área Premium</a>
            </li>
            <li class="nav-item">
              <button id="themeToggle" class="btn btn-outline-light btn-sm">🌓 Tema</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="py-4 border-top border-secondary-subtle">
      <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <small>© {{ 2026 }} TradingBots Pro. Todos los derechos reservados.</small>
        <small>Soporte: soporte@tradingbotspro.dev</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
